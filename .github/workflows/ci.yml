name: CI
on: [push, pull_request]

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "${{ matrix.python }}" }
      - run: pip install -e ".[dev,crypto]"
      - run: pytest tests/ -q
      # El agente debe arrancar sin ningun modelo vivo: doctor reporta, no explota.
      - run: fib doctor
        continue-on-error: true
      - run: fib config

  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -e ".[dev,crypto]"
      - run: pytest tests/ --cov=fibonacci --cov-report=term-missing --cov-fail-under=60
      - name: Modulos sin cobertura
        run: pytest tests/ --cov=fibonacci --cov-report=term | sort -k4 -n | head -20

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install ruff
      - run: ruff check fibonacci/ tests/

  sin-red:
    # Verifica la promesa: ninguna prueba debe salir a internet.
    runs-on: ubuntu-latest
    # Si algo se cuelga, que falle en 20 minutos y no consuma el tope de 6h.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -e ".[dev,crypto]"
      - name: Bloquear salida externa y correr pruebas
        run: |
          # El bloqueo se aplica SOLO al usuario que corre las pruebas.
          #
          # La versión anterior hacía `iptables -A OUTPUT -j REJECT` a secas y
          # el job se colgaba para siempre: esa regla también cortaba al agente
          # del runner, que necesita hablar con GitHub para reportar el
          # resultado. El job nunca terminaba —ni en verde ni en rojo— así que
          # la promesa que decía verificar no se verificaba desde el principio.
          sudo useradd -m sinred
          # `sinred` tiene que poder recorrer hasta el repo: el obstáculo es
          # /home/runner, que es 0700, no el repo. Sin esto pytest revienta con
          # EACCES al buscar su archivo de configuración hacia arriba.
          D="$GITHUB_WORKSPACE"
          while [ "$D" != "/" ]; do sudo chmod o+x "$D"; D=$(dirname "$D"); done
          sudo chmod -R a+rX "$GITHUB_WORKSPACE"
          PY=$(which python)
          sudo iptables -A OUTPUT -m owner --uid-owner sinred -o lo -j ACCEPT
          sudo iptables -A OUTPUT -m owner --uid-owner sinred -d 127.0.0.0/8 -j ACCEPT
          sudo iptables -A OUTPUT -m owner --uid-owner sinred -j REJECT
          # Comprobación de que el bloqueo existe de verdad: si esto llega a
          # internet, la regla no está puesta y el job no prueba nada.
          if sudo -u sinred curl -s --max-time 8 https://pypi.org >/dev/null; then
            echo "El bloqueo de red no se aplicó: la prueba no valdría nada."
            exit 1
          fi
          # -H para que el usuario sandbox use SU home: si hereda el del
          # runner, cualquier prueba que se escape del aislamiento intenta
          # escribir ahí. (Eso destapó justamente una que se escapaba.)
          sudo -H -u sinred "$PY" -m pytest tests/ -q -p no:cacheprovider
