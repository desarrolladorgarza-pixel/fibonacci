[project]
name = "fibonacci-agent"
version = "0.7.0"
description = "El agente que puedes deshacer. Personal, portátil y reversible."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Chronoshg" }]
keywords = [
    "ai-agent", "ai-agents", "autonomous-agents", "agentic-ai", "agent-framework",
    "llm", "local-llm", "local-first", "ollama", "llama-cpp", "lm-studio",
    "personal-assistant", "personal-agent", "cli-agent", "coding-agent",
    "mcp", "model-context-protocol", "openapi", "tool-use", "function-calling",
    "undo", "reversible", "rollback", "transactional", "audit-log",
    "prompt-injection", "ai-safety", "sandbox", "guardrails",
    "cross-platform", "termux", "offline-ai", "privacy", "self-hosted",
    "anthropic", "openrouter", "deepseek", "hermes-agent",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Natural Language :: Spanish",
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS :: MacOS X",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: System :: Systems Administration",
    "Topic :: Utilities",
    "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
# AES-256-GCM real. Sin este extra, el cifrado cae a un modo de respaldo que
# el propio archivo declara. No es requisito porque romperia la instalacion
# en Termux y aarch64 sin compilador, que es donde mas importa la soberania.
crypto = ["cryptography>=42.0"]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.5"]

[project.urls]
Homepage = "https://github.com/desarrolladorgarza-pixel/fibonacci"
Documentation = "https://github.com/desarrolladorgarza-pixel/fibonacci#readme"
Repository = "https://github.com/desarrolladorgarza-pixel/fibonacci"
Issues = "https://github.com/desarrolladorgarza-pixel/fibonacci/issues"
Changelog = "https://github.com/desarrolladorgarza-pixel/fibonacci/blob/main/CHANGELOG.md"
Security = "https://github.com/desarrolladorgarza-pixel/fibonacci/blob/main/SECURITY.md"

[project.scripts]
fib = "fibonacci.cli:main"
fibonacci = "fibonacci.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["fibonacci*"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "acceptance: verifica una promesa del README contra el codigo",
    "slow: tarda mas de 2 segundos",
    "network: requiere red externa (no deberia haber ninguna)",
]
filterwarnings = ["error::DeprecationWarning"]

[tool.coverage.run]
source = ["fibonacci"]
omit = ["*/tests/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "except ImportError:",
]
